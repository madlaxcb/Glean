[package]
name = "glean-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Glean M0 UI spike: egui shell + WebView2 reader host"
default-run = "glean-spike"

[[bin]]
name = "glean-spike"
path = "src/main.rs"

[dependencies]
glean-core = { workspace = true }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
open = "5"
raw-window-handle = "0.6"
rfd = "0.14"
serde = { workspace = true }
serde_json = "1"
reqwest = { workspace = true }

[target.'cfg(windows)'.dependencies]
wry = "0.50"
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(not(windows))'.dependencies]
fs4 = "0.12"
