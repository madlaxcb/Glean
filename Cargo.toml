[workspace]
resolver = "2"
members = [
    "crates/glean-core",
    "crates/glean-app",
]
default-members = ["crates/glean-app"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/madlaxcb/Glean"

[workspace.dependencies]
glean-core = { path = "crates/glean-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
feed-rs = "2"
ammonia = "4"
url = "2"
scraper = "0.20"
toml = "0.8"
rhai = { version = "1.19", features = ["sync"] }
