[workspace]
resolver = "2"
members = [
    "crates/glean-core",
    "crates/glean-app",
]
default-members = ["crates/glean-app"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/madlaxcb/Glean"

[workspace.dependencies]
glean-core = { path = "crates/glean-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
feed-rs = "2"
ammonia = "4"
url = "2"
