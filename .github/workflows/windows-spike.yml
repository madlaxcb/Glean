name: windows-spike

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Glean Windows (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test (core)
        run: cargo test -p glean-core

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Release build
        run: cargo build -p glean-app --release

      # Fail the job if the PE is still a CONSOLE app (double-click would flash cmd).
      - name: Assert GUI subsystem
        shell: pwsh
        run: |
          $exe = "target/release/glean-spike.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          # IMAGE_OPTIONAL_HEADER.Subsystem is at PE + 24 + 68 for PE32+ (magic 0x20B)
          $magic = [BitConverter]::ToUInt16($bytes, $peOffset + 24)
          if ($magic -ne 0x20B) { throw "Expected PE32+ magic 0x20B, got $magic" }
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          # IMAGE_SUBSYSTEM_WINDOWS_GUI = 2, CUI = 3
          Write-Host "PE Subsystem=$subsystem (2=GUI, 3=CUI)"
          if ($subsystem -ne 2) {
            throw "glean-spike.exe must be WINDOWS GUI subsystem (2), got $subsystem"
          }

      # Clippy remains advisory during M0; promote to hard gate after spike stabilizes.
      - name: Clippy (report only)
        continue-on-error: true
        run: cargo clippy -p glean-core -p glean-app -- -W clippy::all

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/glean-spike.exe dist/glean-spike.exe
          @"
          Glean (M0b shell + core demo)
          =================
          Built by GitHub Actions (windows-latest).

          Requirements:
          - Windows 10 1809+ / Windows 11
          - WebView2 Evergreen Runtime (usually preinstalled on Win11)
            https://developer.microsoft.com/microsoft-edge/webview2/

          Run:
            double-click glean-spike.exe
            (must NOT open a black console window)

          Search box is in the TOP toolbar (IME test).

          M0 Spike conditional pass; M0b uses in-memory SQLite demo (no network).
          See docs/m0b.md and docs/spike-ui.md.
          "@ | Set-Content -Encoding utf8 dist/README-SPIKE.txt

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@v4
        with:
          name: glean-spike-windows-x64
          path: |
            dist/glean-spike.exe
            dist/README-SPIKE.txt
          if-no-files-found: error

      # --- Inno Setup installer ---
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          iscc scripts/package-inno.iss
          # The .iss writes to target/installer/glean-spike-setup.exe.
          if (-not (Test-Path target/installer/glean-spike-setup.exe)) {
            throw "Installer not found at target/installer/glean-spike-setup.exe"
          }

      - name: Upload artifact (installer)
        uses: actions/upload-artifact@v4
        with:
          name: glean-spike-windows-installer
          path: target/installer/glean-spike-setup.exe
          if-no-files-found: error
